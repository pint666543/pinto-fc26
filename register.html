<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PINTO FC26 — Crear cuenta</title>
<style>body{margin:0;background:#03080b;color:#fff;font-family:Segoe UI,Arial;padding:20px}.wrap{max-width:620px;margin:auto}.panel{background:#09151d;border:1px solid #1c3945;border-radius:14px;padding:20px}h1 span{color:#3cff67}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{padding:12px;background:#0b1922;color:#fff;border:1px solid #24404b;border-radius:7px;font-weight:800}.tabs .active{border-color:#3cff67;background:#0c3518}label{display:block;margin:12px 0 5px;color:#a9b9c1;font-size:12px;font-weight:800}input,select{width:100%;box-sizing:border-box;padding:12px;background:#06121a;border:1px solid #25404a;border-radius:7px;color:#fff;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.send{width:100%;padding:14px;margin-top:18px;background:#15983a;border:1px solid #3cff67;color:#fff;border-radius:8px;font-weight:900}.msg{margin-top:12px;padding:12px;background:#0b1b22;border-radius:8px}@media(max-width:520px){.two{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>PINTO <span>FC26</span></h1><div class="panel"><h2>Crear cuenta</h2><p>Te registras una sola vez. Después usarás siempre tu usuario y contraseña.</p>
<div class="tabs"><button class="active" data-role="player">JUGADOR</button><button data-role="dt">DT</button><button data-role="viewer">ESPECTADOR</button></div>
<label>Usuario único</label><input id="username" placeholder="Ej. pint0"><label>Contraseña</label><input id="password" type="password" placeholder="Mínimo 8 caracteres"><label>Nombre / apodo</label><input id="name">
<div id="player"><div class="two"><div><label>EA ID</label><input id="ea"></div><div><label>País</label><input id="country"></div></div><div class="two"><div><label>Posición</label><select id="pos"><option>POR</option><option>DFC</option><option>LI</option><option>LD</option><option>MCD</option><option>MC</option><option>MCO</option><option>EI</option><option>ED</option><option>DC</option></select></div><div><label>Secundaria</label><input id="sec"></div></div><label>Plataforma</label><select id="platform"><option>PC</option><option>PlayStation</option><option>Xbox</option></select></div>
<div id="dt" class="hidden"><div class="two"><div><label>Club</label><input id="club"></div><div><label>Abreviatura</label><input id="abbr" maxlength="4"></div></div><label>Región</label><input id="region"></div>
<label>Discord</label><input id="discord"><button id="send" class="send">CREAR CUENTA</button><div id="msg" class="msg hidden"></div></div></div>
<script>let role="player";document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll("[data-role]").forEach(x=>x.classList.toggle("active",x===b));player.classList.toggle("hidden",role!=="player");dt.classList.toggle("hidden",role!=="dt")});
send.onclick=async()=>{msg.classList.remove("hidden");msg.textContent="Enviando...";const body={role,username:username.value.trim(),password:password.value,display_name:name.value.trim(),ea_id:ea.value.trim(),country:country.value.trim(),platform:platform.value,position:pos.value,secondary_position:sec.value.trim(),club:club.value.trim(),abbr:abbr.value.trim(),region:region.value.trim(),discord:discord.value.trim()};try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(r.status===409)throw new Error("Ese usuario ya está registrado. Usa tu usuario y contraseña para iniciar sesión.");if(!r.ok)throw new Error(j.error==="password_short"?"La contraseña debe tener mínimo 8 caracteres.":"Revisa los datos.");msg.textContent="✅ Cuenta creada. Ahora espera que el Comisionado la apruebe. No necesitas registrarte otra vez.";send.disabled=true}catch(e){msg.textContent="❌ "+e.message}};</script></body></html>
