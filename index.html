<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINTO FC26 — Acceso</title>
<style>
:root{
  --bg:#020507;
  --panel:#070b0e;
  --panel2:#0a1015;
  --line:#20323b;
  --green:#85ff19;
  --green2:#35ff59;
  --text:#f7f9fa;
  --muted:#98a5ac;
  --danger:#ff5a61;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Segoe UI,Inter,Arial,sans-serif;background:#020507;color:var(--text)}
body{
  min-height:100dvh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 18% 44%,rgba(113,255,28,.16),transparent 25%),
    radial-gradient(circle at 84% 18%,rgba(113,255,28,.06),transparent 20%),
    linear-gradient(180deg,#020507 0%,#04090c 50%,#020507 100%);
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.28;
  background:
    linear-gradient(122deg,transparent 0 17%,rgba(115,255,30,.08) 17.2% 17.5%,transparent 17.7% 100%),
    linear-gradient(154deg,transparent 0 42%,rgba(115,255,30,.05) 42.2% 42.4%,transparent 42.6% 100%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 5px);
}
body::after{
  content:"";
  position:fixed;left:-8%;right:-8%;bottom:-80px;height:320px;pointer-events:none;
  background:
    radial-gradient(ellipse at center,rgba(93,255,30,.12),transparent 62%),
    repeating-linear-gradient(8deg,transparent 0 22px,rgba(113,255,28,.025) 23px 24px);
  filter:blur(.2px);
}
.stage{
  min-height:100dvh;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(430px,.85fr);
  gap:42px;
  align-items:center;
  max-width:1500px;
  margin:auto;
  padding:42px 60px;
  position:relative;
  z-index:1;
}
.visual{
  min-height:720px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  padding:36px 20px 24px 10px;
}
.visual::before{
  content:"";
  position:absolute;
  width:620px;height:620px;
  left:-110px;top:48%;
  transform:translateY(-50%);
  border-radius:50%;
  border:1px solid rgba(117,255,32,.08);
  box-shadow:
    0 0 80px rgba(114,255,28,.06),
    inset 0 0 80px rgba(114,255,28,.03);
}
.logoMark{
  position:relative;
  width:min(590px,90%);
  margin:0 auto;
  text-align:center;
  z-index:2;
}
.crown{
  width:118px;height:46px;margin:0 auto -10px;
  position:relative;
  filter:drop-shadow(0 0 18px rgba(128,255,27,.42));
}
.crown::before{
  content:"♛";
  display:block;
  font-size:68px;
  color:var(--green);
  line-height:.75;
}
.shield{
  width:230px;height:230px;
  margin:0 auto 20px;
  clip-path:polygon(50% 0,92% 16%,84% 74%,50% 100%,16% 74%,8% 16%);
  background:linear-gradient(145deg,#baff2a,#2fa90d 46%,#06130a 47% 100%);
  padding:4px;
  filter:drop-shadow(0 0 25px rgba(125,255,25,.35));
  position:relative;
}
.shieldInner{
  width:100%;height:100%;
  clip-path:inherit;
  background:
    radial-gradient(circle at 50% 34%,rgba(129,255,28,.3),transparent 25%),
    linear-gradient(160deg,#07110b,#050809 70%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:1px solid rgba(173,255,94,.3);
}
.shieldIcon{font-size:62px;line-height:1;color:#baff2a}
.shieldText{font-size:24px;font-weight:1000;letter-spacing:-1px}
.shieldText span{color:var(--green)}
.mainLogo{
  margin-top:-24px;
  font-size:clamp(74px,8vw,142px);
  font-weight:1000;
  line-height:.8;
  letter-spacing:-8px;
  font-style:italic;
  text-transform:uppercase;
  color:#fff;
  text-shadow:
    0 5px 0 #7a7f82,
    0 10px 0 #22282b,
    0 0 30px rgba(255,255,255,.1);
}
.mainLogo span{display:block;color:var(--green);font-size:.36em;letter-spacing:-1px;margin-top:20px;text-shadow:0 0 22px rgba(123,255,22,.55)}
.tagline{
  max-width:620px;
  margin:32px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid rgba(132,255,34,.42);
  border-radius:12px;
  overflow:hidden;
  background:rgba(4,9,11,.78);
  backdrop-filter:blur(10px);
}
.tagline div{
  padding:18px 14px;
  text-align:center;
  border-right:1px solid rgba(132,255,34,.16);
  font-size:11px;
  letter-spacing:.5px;
  color:#c8d2d6;
}
.tagline div:last-child{border-right:0}
.tagline b{display:block;color:#fff;font-size:13px;margin-bottom:4px}
.tagline small{color:#8cff1a;font-size:10px}
.loginCard{
  position:relative;
  border:1px solid rgba(138,255,43,.65);
  border-radius:26px;
  background:
    linear-gradient(180deg,rgba(9,13,16,.95),rgba(4,7,9,.97)),
    #06090b;
  padding:48px 44px 38px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.5),
    0 0 40px rgba(113,255,28,.07),
    inset 0 1px 0 rgba(255,255,255,.03);
  overflow:hidden;
}
.loginCard::before{
  content:"";
  position:absolute;left:12%;right:12%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,#b8ff4b,transparent);
  box-shadow:0 0 14px #9bff27;
}
.loginCard::after{
  content:"";
  position:absolute;width:170px;height:170px;right:-60px;top:-60px;
  border-radius:50%;background:rgba(126,255,31,.06);filter:blur(12px);
}
.loginBadge{
  width:88px;height:88px;margin:-92px auto 22px;
  border-radius:22px 22px 34px 34px;
  background:linear-gradient(160deg,#121a1f,#05090b);
  border:2px solid var(--green);
  display:grid;place-items:center;
  font-size:40px;
  box-shadow:0 0 25px rgba(125,255,25,.3);
  position:relative;z-index:2;
}
.welcome{text-align:center;color:#97ff28;font-size:12px;letter-spacing:7px;text-transform:uppercase;margin-top:8px}
h1{text-align:center;font-size:48px;margin:18px 0 8px;letter-spacing:-2px;text-transform:uppercase}
h1 span{color:var(--green)}
.neonLine{width:68px;height:5px;border-radius:9px;background:var(--green);margin:18px auto 34px;box-shadow:0 0 15px rgba(129,255,25,.7)}
.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;
  background:#050a0d;padding:5px;border-radius:12px;margin-bottom:24px;
}
.tabs button{
  border:0;background:transparent;color:#8fa0a9;padding:12px;
  border-radius:8px;font-weight:900;cursor:pointer;transition:.2s;
}
.tabs button.active{background:#0e3b15;color:#fff;box-shadow:inset 0 0 0 1px #1b7b2c}
.form.hidden{display:none}
.form{animation:fadeUp .28s ease both}
.field{position:relative;margin-bottom:18px}
.field input,.field select{
  width:100%;min-height:72px;padding:0 18px 0 58px;
  background:linear-gradient(180deg,#0b1115,#080d10);
  border:1px solid #26343b;border-radius:11px;color:#fff;font-size:16px;
  outline:none;transition:.18s;
}
.field select{padding-left:18px}
.field input:focus,.field select:focus{
  border-color:#81ff1f;
  box-shadow:0 0 0 3px rgba(129,255,31,.06),0 0 25px rgba(129,255,31,.05);
  transform:translateY(-1px);
}
.fieldIcon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:22px;color:#8cff1b;z-index:2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{display:block;font-size:11px;color:#a8b4ba;font-weight:800;margin:11px 0 6px}
.input,.form input,.form select{
  width:100%;min-height:48px;padding:12px 13px;
  background:#091015;border:1px solid #25343b;border-radius:8px;color:#fff;outline:none;
}
.primaryBtn{
  width:100%;min-height:66px;margin-top:20px;border:1px solid #c5ff57;
  border-radius:9px;background:linear-gradient(180deg,#a9ff1f,#66dd09);
  color:#061006;font-size:18px;font-weight:1000;cursor:pointer;
  box-shadow:0 0 26px rgba(139,255,24,.25);transition:.18s;
}
.primaryBtn:hover{filter:brightness(1.06);box-shadow:0 0 36px rgba(139,255,24,.34)}
.primaryBtn:active{transform:scale(.99)}
.msg{margin-top:14px;padding:12px;border-radius:8px;background:#0b151b;border:1px solid #243943;font-size:13px}
.msg.hidden{display:none}
.msg.ok{background:#0a2210;border-color:#246d32}.msg.err{background:#260d11;border-color:#68323a}
.formNote{text-align:center;color:#8998a0;font-size:12px;margin-top:16px}
.formNote b{color:#8cff1a}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(128,255,25,.25))}50%{filter:drop-shadow(0 0 26px rgba(128,255,25,.5))}}
.shield{animation:pulse 3s ease-in-out infinite}
@media(max-width:980px){
  .stage{grid-template-columns:1fr;padding:20px 16px 44px;gap:22px}
  .visual{min-height:auto;padding:12px 0}
  .visual::before{display:none}
  .shield{width:150px;height:150px}.shieldIcon{font-size:42px}.shieldText{font-size:17px}
  .mainLogo{font-size:72px;letter-spacing:-4px}.mainLogo span{margin-top:15px}
  .tagline{display:none}
  .loginCard{padding:42px 18px 28px;border-radius:20px}
  .loginBadge{display:none}
  h1{font-size:36px}.welcome{letter-spacing:4px}
  .two{grid-template-columns:1fr}
  .field input{min-height:58px}
}
@media(max-width:560px){
  .visual{display:none}
  .stage{display:block;padding:0}
  .loginCard{min-height:100dvh;border:0;border-radius:0;padding:34px 16px 100px}
  .loginCard::before{left:0;right:0}
  .welcome{margin-top:12px}
  h1{font-size:32px;margin-top:14px}
  .tabs{position:sticky;top:0;z-index:20}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== iOS SAFARI HOTFIX 1.0.9 ===== */
.fieldIcon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  width:24px;
  height:24px;
  z-index:2;
  color:var(--green);
  pointer-events:none;
}
.userIcon::before{
  content:"";
  position:absolute;
  width:9px;height:9px;
  border:2px solid currentColor;
  border-radius:50%;
  left:6px;top:1px;
}
.userIcon::after{
  content:"";
  position:absolute;
  width:16px;height:9px;
  border:2px solid currentColor;
  border-bottom:0;
  border-radius:10px 10px 0 0;
  left:2px;bottom:1px;
}
.lockIcon::before{
  content:"";
  position:absolute;
  width:10px;height:9px;
  border:2px solid currentColor;
  border-bottom:0;
  border-radius:8px 8px 0 0;
  left:5px;top:1px;
}
.lockIcon::after{
  content:"";
  position:absolute;
  width:17px;height:13px;
  border:2px solid currentColor;
  border-radius:3px;
  left:2px;bottom:1px;
}
.field input{
  padding-left:60px!important;
  -webkit-appearance:none;
  appearance:none;
}
@media(max-width:560px){
  .field{margin-bottom:14px}
  .field input{
    min-height:62px!important;
    font-size:16px!important;
    padding-left:58px!important;
  }
  .fieldIcon{left:19px;width:22px;height:22px}
  .primaryBtn{min-height:62px!important;font-size:16px!important}
  .loginCard{padding-top:30px!important}
  .welcome{font-size:11px!important;letter-spacing:5px!important}
  h1{font-size:31px!important;line-height:1.05!important}
  .neonLine{margin:17px auto 28px!important}
}


/* ===== REAL ANIMATED PINTO LOGO 1.0.10 ===== */
.realLogoWrap{
  position:relative;
  width:min(650px,95%);
  margin:0 auto;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.realPintoLogo{
  display:block;
  width:100%;
  height:auto;
  max-height:680px;
  object-fit:contain;
  position:relative;
  z-index:2;
  transform-origin:center;
  animation:
    logoFloat 4.6s ease-in-out infinite,
    logoPulse 3.2s ease-in-out infinite;
  filter:
    drop-shadow(0 16px 28px rgba(0,0,0,.6))
    drop-shadow(0 0 18px rgba(118,255,30,.28));
  will-change:transform,filter;
}
.logoAura{
  position:absolute;
  width:72%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(131,255,30,.19) 0%,rgba(77,255,27,.08) 38%,transparent 72%);
  filter:blur(18px);
  z-index:1;
  animation:auraBreath 3.2s ease-in-out infinite;
}
.realLogoWrap::before,
.realLogoWrap::after{
  content:"";
  position:absolute;
  inset:13% 10%;
  border:1px solid rgba(132,255,31,.11);
  clip-path:polygon(50% 0,93% 18%,86% 78%,50% 100%,14% 78%,7% 18%);
  z-index:0;
  animation:ringPulse 4.8s ease-in-out infinite;
}
.realLogoWrap::after{
  inset:18% 15%;
  opacity:.55;
  animation-delay:-2.4s;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-10px) scale(1.012)}
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 16px 28px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(118,255,30,.22))}
  50%{filter:drop-shadow(0 18px 32px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(118,255,30,.5))}
}
@keyframes auraBreath{
  0%,100%{transform:scale(.92);opacity:.55}
  50%{transform:scale(1.08);opacity:1}
}
@keyframes ringPulse{
  0%,100%{transform:scale(.95);opacity:.18}
  50%{transform:scale(1.04);opacity:.48}
}
@media(max-width:980px){
  .realLogoWrap{width:min(430px,80vw)}
  .realPintoLogo{max-height:420px}
}
@media(max-width:560px){
  .visual{display:block!important;padding:18px 0 0!important}
  .realLogoWrap{width:180px;margin:0 auto 4px}
  .realPintoLogo{max-height:180px}
  .logoAura{width:100%}
  .tagline{display:none!important}
  .stage{display:block!important;padding:0!important}
  .loginCard{min-height:auto!important;border-top:1px solid rgba(138,255,43,.22)!important;padding-top:26px!important}
}
@media(prefers-reduced-motion:reduce){
  .realPintoLogo,.logoAura,.realLogoWrap::before,.realLogoWrap::after{animation:none!important}
}

</style>
</head>
<body>
<main class="stage">
  <section class="visual">
    <div class="logoMark realLogoWrap">
      <div class="logoAura"></div>
      <img src="/assets/pinto-draft-logo.png" alt="PINTO Draft FC26" class="realPintoLogo">
    </div>
    <div class="tagline">
      <div><b>⚔ COMPITE</b><small>EN DRAFTS 11V11</small></div>
      <div><b>🏆 DEMUESTRA</b><small>TU NIVEL</small></div>
      <div><b>👥 FORMA PARTE</b><small>DE LA ÉLITE</small></div>
    </div>
  </section>

  <section class="loginCard">
    <div class="loginBadge">♟</div>
    <div class="welcome">BIENVENIDO DE NUEVO</div>
    <h1>INICIAR <span>SESIÓN</span></h1>
    <div class="neonLine"></div>

    <div class="tabs">
      <button id="tabLogin" class="active">INICIAR SESIÓN</button>
      <button id="tabRegister">CREAR CUENTA</button>
    </div>

    <div id="loginForm" class="form">
      <div class="field">
        <span class="fieldIcon userIcon" aria-hidden="true"></span>
        <input id="loginUser" autocomplete="username" placeholder="Usuario">
      </div>
      <div class="field">
        <span class="fieldIcon lockIcon" aria-hidden="true"></span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Contraseña">
      </div>
      <button id="loginBtn" class="primaryBtn">INICIAR SESIÓN →</button>
      <div id="loginMsg" class="msg hidden"></div>
      <div class="formNote">¿No tienes cuenta? <b>Regístrate aquí</b></div>
    </div>

    <div id="registerForm" class="form hidden">
      <label class="label">Tipo de cuenta</label>
      <select id="role" class="input"><option value="player">Jugador</option><option value="dt">DT</option><option value="viewer">Espectador</option></select>

      <div class="two">
        <div><label class="label">Usuario único</label><input id="user" class="input"></div>
        <div><label class="label">Contraseña</label><input id="pass" class="input" type="password" placeholder="Mínimo 8 caracteres"></div>
      </div>

      <label class="label">Nombre / apodo</label>
      <input id="name" class="input">

      <div id="playerFields">
        <div class="two">
          <div><label class="label">EA ID</label><input id="ea" class="input"></div>
          <div><label class="label">País</label><input id="country" class="input"></div>
        </div>
        <div class="two">
          <div><label class="label">Posición</label>
            <select id="position" class="input"><option>POR</option><option>DFC</option><option>LI</option><option>LD</option><option>MCD</option><option>MC</option><option>MCO</option><option>EI</option><option>ED</option><option>DC</option></select>
          </div>
          <div><label class="label">Secundaria</label><input id="secondary" class="input"></div>
        </div>
        <label class="label">Plataforma</label>
        <select id="platform" class="input"><option>PC</option><option>PlayStation</option><option>Xbox</option></select>
      </div>

      <div id="dtFields" class="hidden">
        <div class="two">
          <div><label class="label">Club</label><input id="club" class="input"></div>
          <div><label class="label">Abreviatura</label><input id="abbr" class="input" maxlength="4"></div>
        </div>
        <label class="label">Región</label><input id="region" class="input">
      </div>

      <label class="label">Discord</label><input id="discord" class="input">
      <button id="registerBtn" class="primaryBtn">CREAR CUENTA →</button>
      <div id="registerMsg" class="msg hidden"></div>
      <div class="formNote">Tu cuenta quedará <b>pendiente de aprobación</b>.</div>
    </div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
function msg(el,t,c=""){el.textContent=t;el.classList.remove("hidden","ok","err");if(c)el.classList.add(c)}
function showLogin(v){
  $("loginForm").classList.toggle("hidden",!v);
  $("registerForm").classList.toggle("hidden",v);
  $("tabLogin").classList.toggle("active",v);
  $("tabRegister").classList.toggle("active",!v);
  document.querySelector("h1").innerHTML=v?'INICIAR <span>SESIÓN</span>':'CREAR <span>CUENTA</span>';
}
$("tabLogin").onclick=()=>showLogin(true);
$("tabRegister").onclick=()=>showLogin(false);
document.querySelector(".formNote")?.addEventListener("click",()=>showLogin(false));

function fields(){
  const r=$("role").value;
  $("playerFields").classList.toggle("hidden",r!=="player");
  $("dtFields").classList.toggle("hidden",r!=="dt");
}
$("role").onchange=fields; fields();

$("registerBtn").onclick=async()=>{
  const m=$("registerMsg");msg(m,"Creando cuenta...");
  const b={
    role:$("role").value,
    username:$("user").value.trim(),
    password:$("pass").value,
    display_name:$("name").value.trim(),
    ea_id:$("ea").value.trim(),
    country:$("country").value.trim(),
    platform:$("platform").value,
    position:$("position").value,
    secondary_position:$("secondary").value.trim(),
    club:$("club").value.trim(),
    abbr:$("abbr").value.trim(),
    region:$("region").value.trim(),
    discord:$("discord").value.trim()
  };
  try{
    const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
    const j=await r.json();
    if(r.status===409)throw new Error("Ese usuario ya existe.");
    if(!r.ok)throw new Error(j.error||"No se pudo crear la cuenta.");
    msg(m,"✅ Cuenta creada. Espera aprobación del Comisionado.","ok");
  }catch(e){msg(m,"❌ "+e.message,"err")}
};

$("loginBtn").onclick=async()=>{
  const m=$("loginMsg");msg(m,"Comprobando...");
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("loginUser").value.trim(),password:$("loginPass").value})});
    const j=await r.json();
    if(!r.ok){
      if(j.error==="pending")throw new Error("Cuenta pendiente de aprobación.");
      if(j.error==="rejected")throw new Error("Cuenta rechazada.");
      throw new Error("Usuario o contraseña incorrectos.");
    }
    localStorage.setItem("pinto_auth_token",j.token);
    localStorage.setItem("pinto_auth_user",JSON.stringify(j.user));
    location.href="/app.html";
  }catch(e){msg(m,"❌ "+e.message,"err")}
};

(async()=>{
  const t=localStorage.getItem("pinto_auth_token");
  if(!t)return;
  try{
    const r=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+t}});
    if(r.ok)location.href="/app.html";
  }catch{}
})();
</script>
</body>
</html>
