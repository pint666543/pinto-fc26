<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINTO FC26 — Acceso</title>
<style>
:root{--g:#3cff67;--m:#8ea1ac}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(60,255,103,.10),transparent 28%),linear-gradient(#020609,#06100b);color:#fff;font-family:Segoe UI,Arial}
.shell{width:min(1050px,100%);display:grid;grid-template-columns:1.05fr .95fr;border:1px solid #183844;border-radius:18px;overflow:hidden;background:#061017;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.hero{padding:46px;background:#050d11}.brand{font-size:32px;font-weight:950;font-style:italic}.brand span{color:var(--g)}.hero h1{font-size:52px;line-height:.96;margin:70px 0 16px}.hero h1 em{color:var(--g)}.hero p{color:#bcc9cf;line-height:1.55}.card{padding:34px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#040c10;padding:5px;border-radius:9px}.tabs button{border:0;background:transparent;color:#91a2ac;padding:12px;border-radius:6px;font-weight:850;cursor:pointer}.tabs button.active{background:#0c3719;color:#fff}
.hidden{display:none!important}.form{margin-top:22px}label{display:block;font-size:11px;color:#a8b8c0;font-weight:800;margin:12px 0 5px}input,select{width:100%;padding:12px;background:#06121a;border:1px solid #21404c;border-radius:7px;color:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:18px;padding:13px;border-radius:7px;border:1px solid var(--g);background:#15983a;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:12px;padding:11px;border-radius:7px;background:#09171e}.ok{background:#092013}.err{background:#210b0f}.small{font-size:12px;color:var(--m);margin-top:12px}
@media(max-width:800px){.shell{grid-template-columns:1fr}.hero{display:none}}

/* ===== MOBILE 1.0.6 ===== */
@media(max-width:800px){
  body{padding:0!important;display:block!important;min-height:100dvh!important;background:#020609!important}
  .shell{display:block!important;width:100%!important;min-height:100dvh!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#040c10!important}
  .hero{display:block!important;padding:22px 20px 8px!important;background:linear-gradient(180deg,#06100b,#040c10)!important}
  .hero h1{font-size:34px!important;line-height:1!important;margin:22px 0 8px!important}
  .hero p{font-size:13px!important;margin:0!important;color:#9eb0b8!important}
  .brand{font-size:25px!important}
  .card{padding:18px 16px 100px!important}
  .tabs{position:sticky!important;top:0!important;z-index:5!important}
  .tabs button{min-height:48px!important;font-size:12px!important}
  .form{margin-top:18px!important}
  .form h2{font-size:24px!important}
  .two{grid-template-columns:1fr!important;gap:0!important}
  label{font-size:12px!important;margin-top:14px!important}
  input,select{min-height:48px!important;font-size:16px!important;border-radius:9px!important}
  .btn{min-height:52px!important;font-size:15px!important;border-radius:9px!important}
  .msg{font-size:13px!important;line-height:1.45!important}
}

</style>
</head>
<body>
<div class="shell">
<section class="hero">
  <div class="brand">PINTO <span>FC26</span></div>
  <h1>Tu liga.<br><em>Una sola cuenta.</em></h1>
  <p>Jugador, DT o espectador se registra una vez. El Comisionado aprueba la cuenta y luego siempre se entra con usuario y contraseña.</p>
</section>
<section class="card">
  <div class="tabs"><button id="tabLogin" class="active">INICIAR SESIÓN</button><button id="tabRegister">CREAR CUENTA</button></div>

  <div id="loginForm" class="form">
    <h2>Iniciar sesión</h2>
    <label>Usuario</label><input id="loginUser">
    <label>Contraseña</label><input id="loginPass" type="password">
    <button id="loginBtn" class="btn">ENTRAR</button>
    <div id="loginMsg" class="msg hidden"></div>
  </div>

  <div id="registerForm" class="form hidden">
    <h2>Crear cuenta</h2>
    <label>Tipo</label>
    <select id="role"><option value="player">Jugador</option><option value="dt">DT</option><option value="viewer">Espectador</option></select>
    <div class="two">
      <div><label>Usuario único</label><input id="user"></div>
      <div><label>Contraseña</label><input id="pass" type="password" placeholder="Mínimo 8 caracteres"></div>
    </div>
    <label>Nombre / apodo</label><input id="name">

    <div id="playerFields">
      <div class="two"><div><label>EA ID</label><input id="ea"></div><div><label>País</label><input id="country"></div></div>
      <div class="two">
        <div><label>Posición</label><select id="position"><option>POR</option><option>DFC</option><option>LI</option><option>LD</option><option>MCD</option><option>MC</option><option>MCO</option><option>EI</option><option>ED</option><option>DC</option></select></div>
        <div><label>Secundaria</label><input id="secondary"></div>
      </div>
      <label>Plataforma</label><select id="platform"><option>PC</option><option>PlayStation</option><option>Xbox</option></select>
    </div>

    <div id="dtFields" class="hidden">
      <div class="two"><div><label>Club</label><input id="club"></div><div><label>Abreviatura</label><input id="abbr"></div></div>
      <label>Región</label><input id="region">
    </div>

    <label>Discord</label><input id="discord">
    <button id="registerBtn" class="btn">CREAR CUENTA</button>
    <div id="registerMsg" class="msg hidden"></div>
    <div class="small">La cuenta queda pendiente hasta aprobación.</div>
  </div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
function msg(el,t,c=""){el.textContent=t;el.classList.remove("hidden","ok","err");if(c)el.classList.add(c)}
function showLogin(v){$("loginForm").classList.toggle("hidden",!v);$("registerForm").classList.toggle("hidden",v);$("tabLogin").classList.toggle("active",v);$("tabRegister").classList.toggle("active",!v)}
$("tabLogin").onclick=()=>showLogin(true);
$("tabRegister").onclick=()=>showLogin(false);

function fields(){
  const r=$("role").value;
  $("playerFields").classList.toggle("hidden",r!=="player");
  $("dtFields").classList.toggle("hidden",r!=="dt");
}
$("role").onchange=fields; fields();

$("registerBtn").onclick=async()=>{
  const m=$("registerMsg"); msg(m,"Enviando...");
  const b={role:$("role").value,username:$("user").value.trim(),password:$("pass").value,display_name:$("name").value.trim(),ea_id:$("ea").value.trim(),country:$("country").value.trim(),platform:$("platform").value,position:$("position").value,secondary_position:$("secondary").value.trim(),club:$("club").value.trim(),abbr:$("abbr").value.trim(),region:$("region").value.trim(),discord:$("discord").value.trim()};
  try{
    const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
    const j=await r.json();
    if(r.status===409)throw new Error("Ese usuario ya existe.");
    if(!r.ok)throw new Error(j.error||"No se pudo crear la cuenta.");
    msg(m,"✅ Cuenta creada. Espera aprobación.","ok");
  }catch(e){msg(m,"❌ "+e.message,"err")}
};

$("loginBtn").onclick=async()=>{
  const m=$("loginMsg"); msg(m,"Comprobando...");
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("loginUser").value.trim(),password:$("loginPass").value})});
    const j=await r.json();
    if(!r.ok){
      if(j.error==="pending")throw new Error("Cuenta pendiente de aprobación.");
      if(j.error==="rejected")throw new Error("Cuenta rechazada.");
      throw new Error("Usuario o contraseña incorrectos.");
    }
    localStorage.setItem("pinto_auth_token",j.token);
    localStorage.setItem("pinto_auth_user",JSON.stringify(j.user));
    location.href="/app.html";
  }catch(e){msg(m,"❌ "+e.message,"err")}
};

(async()=>{
  const t=localStorage.getItem("pinto_auth_token");
  if(!t)return;
  try{
    const r=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+t}});
    if(r.ok)location.href="/app.html";
  }catch{}
})();
</script>
</body></html>
